---
name: Release

"on":
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and release collection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # voidzero-dev/setup-vp v1.22.0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          version-file: package.json
          run-install: |
            args: ["--frozen-lockfile"]
      - name: Check repository
        run: vp run check
      # changesets/action v2.1.2
      - name: Version or release collection
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          commit-message: "chore: version skill collection"
          create-github-releases: true
          pr-title: "chore: version skill collection"
          publish-script: vp run release
          version-script: vp run version-packages
